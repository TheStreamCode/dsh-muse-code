# Muse Code subscription provider for DeepSeek Harness.
#
# A second pi-ai adapter instance serves the `muse-code` route, so the
# existing `llm-pi-ai` provider configuration is not replaced. The auth
# plugin registers the device-code flow and stores the minted key under the
# MUSE_CODE_SUB_TOKEN credential reference used by apiKeyEnv.
- insert:
    - id: muse-code-llm
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          muse-code:
            displayName: Muse Code (subscription)
            apiKeyEnv: MUSE_CODE_SUB_TOKEN
            api: openai-responses
            baseURL: https://api.meta.ai/v1
            models:
              - id: muse-spark-1.3
                name: Muse Spark 1.3
                contextWindow: 1048576
                maxTokens: 131072
                input: [text, image]
                reasoningEfforts:
                  minimal: minimal
                  low: low
                  medium: medium
                  high: high
                  xhigh: xhigh
                  max: max
              - id: muse-spark-1.2
                name: Muse Spark 1.2
                contextWindow: 1048576
                maxTokens: 131072
                input: [text, image]
                reasoningEfforts:
                  minimal: minimal
                  low: low
                  medium: medium
                  high: high
                  xhigh: xhigh
                  max: max
              - id: muse-wonder-1.0
                name: Muse Wonder 1.0
                contextWindow: 1048576
                maxTokens: 131072
                input: [text, image]
                reasoningEfforts:
                  minimal: minimal
                  low: low
                  medium: medium
                  high: high
                  xhigh: xhigh
                  max: max
              - id: muse-wonder-full-1.0
                name: Muse Wonder Full 1.0
                contextWindow: 1048576
                maxTokens: 131072
                input: [text, image]
                reasoningEfforts:
                  minimal: minimal
                  low: low
                  medium: medium
                  high: high
                  xhigh: xhigh
                  max: max
    - id: muse-code-auth
      name: '@thestreamcode/dsh-muse-code'
      config: {}
