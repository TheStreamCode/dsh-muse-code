# Muse Code (Meta subscription) integration for DeepSeek Harness.
#
# DeepSeek Harness already ships the provider and its sign-in: the pi-ai catalog
# serves the `meta` route (https://api.meta.ai/v1) and registers the
# `llm-pi-ai/meta` authorization flow. This bundle inserts only its integration
# plugin, which declares that route in the `llm-pi-ai` settings section and adds
# the `/muse-login` command.
#
# Do not insert a second `@deepseek-ai/dsh-llm-pi-ai` row here: every instance
# declares the whole installed provider catalog, so the extra instance cannot
# activate ("configurable provider ... is already declared").
- insert:
    - id: muse-code
      name: '@thestreamcode/dsh-muse-code'
      config: {}
